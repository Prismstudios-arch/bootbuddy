# fly launch will ask to overwrite this — keep it; it encodes the ops
# decisions from the brief (2 machines for zero-downtime, health checks).
app = "boot-sale-buddy-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Migrations run before new machines take traffic; drizzle/ ships in the image.
  release_command = "node dist/migrate.js"

[http_service]
  internal_port = 8080
  force_https = true
  # One machine while there are no users — two roughly doubles the bill for
  # zero-downtime deploys nobody is around to notice. Put this back to 2
  # (and run `fly scale count 2`) before launch, when a few seconds of
  # downtime during a deploy starts to matter.
  auto_stop_machines = "stop"  # sleeps when idle, wakes on request
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
